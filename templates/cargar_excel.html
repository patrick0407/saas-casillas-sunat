{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
        <h3 class="mb-3">Cargar Comprobantes desde Excel</h3>
        <p class="text-muted">Subes tu archivo <code>.xlsx</code> y la tabla de comprobantes se actualizará en tiempo real.</p>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="archivo_excel" class="form-label">Selecciona el archivo Excel:</label>
                <input type="file" class="form-control" name="archivo_excel" id="archivo_excel" accept=".xlsx, .xls" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Subir e Importar Comprobantes</button>
        </form>
    </div>
</div>
{% endblock %}
